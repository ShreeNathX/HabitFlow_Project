<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8f4"><title>Daymark — grow at your pace</title>
<style>
:root{--ink:#28362e;--muted:#78857e;--green:#315d4a;--mint:#e6f0e8;--paper:#f6f8f4;--line:#e6ebe5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:25px 16px;border-right:1px solid var(--line);background:#fbfcfa;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:800;padding:0 9px 28px}.logo{display:inline-grid;place-items:center;background:var(--green);color:white;width:31px;height:31px;border-radius:10px;margin-right:8px}.nav{display:grid;gap:5px}.nav button{border:0;background:none;border-radius:10px;text-align:left;padding:11px;color:var(--muted);font-weight:650;cursor:pointer}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green)}.offline{margin-top:auto;border:1px solid var(--line);background:white;padding:12px;border-radius:13px;color:var(--muted);font-size:11px}.main{width:min(1120px,100%);margin:auto;padding:28px 42px 55px}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:28px}.pill{background:white;border:1px solid var(--line);border-radius:30px;padding:6px 10px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#829087;font-weight:750}.welcome h1,.title{font-size:clamp(27px,4vw,39px);letter-spacing:-1.3px;line-height:1.15;margin:7px 0}.welcome p,.intro{font-size:13px;color:var(--muted);margin:0}.btn{border:0;background:var(--green);color:white;padding:11px 15px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}.btn.light{background:white;color:var(--green);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1.65fr .8fr;gap:16px}.hero{background:var(--green);color:white;padding:23px;border-radius:18px;min-height:250px}.hero small{font-size:10px;letter-spacing:1px;color:#d5e2d9}.hero h2{font-size:24px;line-height:1.2;margin:18px 0 7px}.hero p{font-size:13px;color:#d9e5dc}.proof{font-size:11px;background:#ffffff16;border-radius:9px;padding:9px;margin-top:14px}.herofoot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;gap:10px}.hero .btn{background:#d9ef8b;color:#29382e}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 28px #20322708}.right{display:grid;gap:12px;align-content:start}.card h3{font-size:13px;margin:0}.num{font-size:29px;font-weight:800;margin:10px 0}.bar{height:7px;background:#edf1ec;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#79a58a}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.section{display:flex;justify-content:space-between;margin:24px 0 10px}.section h2{font-size:16px;margin:0}.link{border:0;background:none;color:var(--green);font-weight:700;cursor:pointer}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:white;border:1px solid var(--line);border-radius:12px;padding:11px}.idx{width:29px;height:29px;border-radius:9px;background:#f0f3ef;display:grid;place-items:center;font-size:11px}.step h3{font-size:12px;margin:0}.step p{font-size:10px;color:var(--muted);margin:2px 0 0}.state{font-size:10px;color:var(--muted)}.empty{text-align:center;padding:55px 20px}.empty h2{font-size:21px}.empty p{font-size:13px;color:var(--muted);max-width:430px;margin:0 auto 18px}.note{font-size:10px;color:#748078;background:#eff3ed;padding:11px;border-radius:10px;margin-top:13px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:10px;text-transform:uppercase;font-weight:750;letter-spacing:.7px}.field input,.field select,.field textarea,.chatinput{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fcfdfb;font:12px system-ui}.form{max-width:720px;padding:23px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 15px}.full{grid-column:1/-1}.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.goal{display:flex;align-items:center;justify-content:space-between}.goal small{display:block;color:var(--muted);font-size:10px}.goal button{border:0;background:none;cursor:pointer;color:var(--muted)}.chat{max-width:720px;padding:0;overflow:hidden}.msgs{height:330px;padding:17px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;background:#eff3ed;border-radius:12px;padding:10px;font-size:12px}.bubble.you{align-self:end;background:var(--green);color:white}.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chat form input{flex:1}.settings{max-width:650px}.setting{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting small{display:block;color:var(--muted);font-size:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;background:#24372e;color:white;padding:10px 15px;border-radius:10px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:780px){.app{grid-template-columns:65px 1fr}.side{padding:17px 6px}.brand{font-size:0;padding:0 9px 22px}.nav button{text-align:center;font-size:10px;padding:9px 1px}.main{padding:22px 18px}.grid{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr}.right>:last-child{grid-column:1/-1}}@media(max-width:540px){.app{display:block}.side{position:fixed;z-index:4;bottom:0;left:0;right:0;height:60px;padding:4px;border:0;border-top:1px solid var(--line)}.brand,.offline{display:none}.nav{display:flex;justify-content:space-around}.nav button{flex:1}.main{padding:17px 13px 78px}.welcome{align-items:start}.welcome .btn{padding:9px;font-size:10px}.hero{padding:18px}.herofoot{align-items:start;flex-direction:column}.right{grid-template-columns:1fr}.right>:last-child{grid-column:auto}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.step{grid-template-columns:30px 1fr}.state{grid-column:2}}
</style>
<div class="app"><aside class="side"><div class="brand"><span class="logo">↗</span>daymark</div><div class="nav" id="nav"><button class="active" data-page="home">⌂ &nbsp; Today</button><button data-page="goals">◎ &nbsp; My goals</button><button data-page="coach">✳ &nbsp; Coach</button><button data-page="settings">⚙ &nbsp; Settings</button></div><div class="offline">● &nbsp; Ready offline<br>Plans stay on this device.</div></aside><main class="main"><header class="top"><span id="date"></span><span class="pill">● &nbsp; Works offline</span></header><div id="view"></div></main></div><div class="toast" id="toast"></div>
<script>
(()=>{const K="daymark.v1";let D;try{D=JSON.parse(localStorage.getItem(K))||{goals:[],name:"You",chat:[]}}catch{D={goals:[],name:"You",chat:[]}}let page="home";const $=s=>document.querySelector(s),safe=s=>String(s||"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x])),save=()=>localStorage.setItem(K,JSON.stringify(D)),now=()=>{let d=new Date;return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")},elapsed=g=>Math.max(0,Math.floor((new Date(now())-new Date(g.start+"T00:00:00"))/86400000)),stats=g=>({day:Math.min(g.days,elapsed(g)+1),pct:Math.min(100,Math.round(g.done.length/g.days*100))});
const kinds={learning:"Learning",fitness:"Fitness",wellbeing:"Wellbeing",creative:"Creative practice",career:"Career growth",general:"Personal growth"};
const sets={
learning:[["Map your starting point","Write what you know about {g}, what feels unclear, and one outcome you want.","A short baseline note and one question."],["Learn one core idea","Choose a trusted beginner lesson on {g}. Spend {m} minutes on one concept, then explain it in your own words.","A short explanation in your notes."],["Practice with an example","Apply one idea about {g} to a small example. Use a worked example if new to it.","Your example and one thing learned."],["Recall from memory","Close your notes and list key ideas about {g} you remember. Check and correct gaps.","A recall list and one correction."],["Build a tiny project","Make one small artifact using what you learned about {g}. Keep it finishable today.","A saved file, draft, or photo."],["Review and connect","Write how two ideas about {g} connect and where you could use them.","Two connected ideas and one use."],["Rest and reflect","Take a lighter day. Choose one topic to revisit next week.","A short reflection and next topic."]],
fitness:[["Set a comfortable baseline","Note your goal for {g}, available equipment, and how movement feels today. Don’t test your maximum.","A brief baseline note."],["Practice easy movement","Spend {m} minutes on gentle, familiar movement related to {g}. Keep effort comfortable. Stop for pain, dizziness, or unusual breathlessness.","Record movement, time, and how it felt."],["Strength at easy effort","Choose one familiar exercise supporting {g}. Do 2 easy sets, stopping well before strain. Skip anything painful.","Exercise, sets, and comfort level."],["Recover and move gently","Take a recovery day: easy walking or comfortable mobility for {m} minutes. Skip movements that hurt.","What you did and how you feel."],["Repeat and notice","Repeat a familiar, pain-free movement. Focus on steady technique, not doing more.","One thing that felt easier."],["Choose a small progression","Pick one modest change for next week, such as a little more time.","Your change and why it feels manageable."],["Rest and reflect","Rest or take an easy walk. Notice energy, soreness, and enjoyment.","A short recovery check-in."]],
wellbeing:[["Notice your routine","For {g}, note what your day looks like and one small realistic change.","Current routine and chosen change."],["Try one gentle practice","Try a low-risk practice related to {g} for {m} minutes. Stop if it causes discomfort or distress.","What you tried and how it felt."],["Make it easier","Change one small thing in your environment that could support {g}.","Describe the change and if it helped."],["Check in with yourself","Notice how the routine affects you. Keep what feels useful; change what does not.","One useful observation."],["Repeat what worked","Repeat the most manageable practice related to {g}.","What you repeated and why."],["Plan for a busy day","Create a two-minute version of your {g} routine for low-energy days.","Write your fallback plan."],["Reflect and reset","Review the week without judgment. Choose one thing to continue or change.","A next-week intention."]],
creative:[["Collect inspiration","Find three references related to {g}. Note what draws you to each.","Three references and notes."],["Make a rough draft","Spend {m} minutes making a deliberately rough version of something related to {g}.","Save or photograph the draft."],["Practice one technique","Choose one small technique for {g} and practice it slowly for {m} minutes.","A sample and the technique."],["Make a variation","Change one element of an earlier idea related to {g}.","Save both versions and note the change."],["Finish a tiny piece","Choose a small idea you can finish today. Set a {m}-minute timer.","Your finished small piece."],["Review with curiosity","Write one kind observation and one possible improvement.","One observation and next step."],["Rest and gather ideas","Take a break. Save one idea for next week without developing it.","One saved idea."]],
career:[["Define the target","Describe progress in {g}. Choose one skill, role requirement, or work sample to focus on.","A one-sentence target."],["Study one requirement","Review a reliable job description or resource related to {g}. Identify one recurring skill.","The resource and skill noticed."],["Build evidence","Spend {m} minutes creating or improving a small work sample for that skill.","A saved draft or portfolio note."],["Practice your story","Write a short example of a challenge you handled: situation, action, result.","A short draft."],["Get useful feedback","Review your work against one criterion or ask someone you trust. Avoid sharing private information.","One piece of feedback."],["Improve one detail","Make one focused improvement to your sample or story.","A revision and what changed."],["Review and plan","Choose one next action that fits your available time.","A dated next step."]],
general:[["Make the goal concrete","Describe recognizable progress in {g}. Pick one small action today.","A clear outcome and one action."],["Gather what you need","Identify tools, information, or support needed for {g}. Keep research focused.","A short resource list."],["Take a first step","Spend {m} minutes on the smallest useful action toward {g}.","Record what you completed."],["Notice friction","What made {g} easier or harder? Change one practical obstacle if possible.","One obstacle and adjustment."],["Repeat a useful action","Repeat what helped most with {g}, keeping it small enough to finish.","What you repeated and result."],["Create a milestone","Choose a specific, realistic milestone for {g} next week.","A milestone and target day."],["Reflect and reset","Keep one helpful action and adjust one thing that did not fit.","Reflection and next step."]]};
function task(g,n){let a=(sets[g.type]||sets.general)[(n-1)%7],round=Math.floor((n-1)/7);return{title:a[0]+(round?" · Round "+(round+1):""),desc:a[1].replaceAll("{g}",g.title).replaceAll("{m}",g.minutes+" minutes")+(round?" For this round, build on your earlier attempt: change one detail and notice the difference.":""),proof:a[2]}}function esc(s){return safe(s)}function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));({home,goals,coach,settings})[page]()}
function home(){let gs=D.goals.filter(g=>g.active),g=gs.find(x=>!x.done.includes(stats(x).day))||gs[0];if(!g){$("#view").innerHTML='<div class="welcome"><div><div class="eyebrow">A LITTLE PROGRESS ADDS UP</div><h1>Make room for growth.</h1><p>One thoughtful challenge at a time, at your pace.</p></div><button class="btn" data-do="new">+ Set a goal</button></div><div class="card empty"><div style="font-size:36px">🌱</div><h2>What would you like to grow?</h2><p>Learn a skill, build a routine, develop your career, or explore another goal. Get practical daily challenges, saved on this device.</p><button class="btn" data-do="new">Create your first plan</button><div class="note">Works offline after first load. No account or online AI required.</div></div>';return}let s=stats(g),c=task(g,s.day),done=g.done.includes(s.day),rows="";for(let n=1;n<=Math.min(4,g.days);n++){let t=task(g,n),d=g.done.includes(n);rows+='<div class="step"><div class="idx">'+(d?"✓":String(n).padStart(2,"0"))+'</div><div><h3>'+esc(t.title)+'</h3><p>'+esc(t.desc.slice(0,105))+'</p></div><span class="state">'+(d?"Done":n===s.day?"Today":"Upcoming")+"</span></div>"}$("#view").innerHTML='<div class="welcome"><div><div class="eyebrow">A LITTLE PROGRESS ADDS UP</div><h1>Good '+(new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening")+', '+esc(D.name||"friend")+'.</h1><p>Keep showing up for what matters to you.</p></div><button class="btn" data-do="new">+ New goal</button></div><div class="grid"><div><article class="hero"><small>TODAY · DAY '+s.day+" OF "+g.days+'</small><h2>'+esc(c.title)+'</h2><p>'+esc(c.desc)+'</p><div class="proof"><b>Done when:</b> '+esc(c.proof)+'</div><div class="herofoot"><button class="btn" data-do="done" data-id="'+g.id+'" '+(done?"disabled":"")+'>'+(done?"Completed ✓":"Mark challenge complete")+'</button><span style="font-size:11px;color:#d0dfd5">'+g.minutes+" min · "+esc(g.title)+'</span></div></article><div class="section"><h2>This week</h2><button class="link" data-page="goals">View plans →</button></div><div class="steps">'+rows+'</div><div class="note">Offline prompts from bundled templates—not expert advice. Fitness challenges are gentle by default; stop if something feels wrong.</div></div><div class="right"><div class="card"><h3>Your journey</h3><div class="num">'+g.done.length+' <span style="font-size:12px;font-weight:500;color:#78857d">of '+g.days+' challenges</span></div><div class="bar"><i style="width:'+s.pct+'%"></i></div><div class="meta"><span>Started '+g.start+'</span><span>'+Math.max(0,g.days-elapsed(g))+' days left</span></div></div><div class="card"><h3>🔥 &nbsp;'+streak(g)+' day streak</h3><span style="font-size:10px;color:#78857d">Progress counts, even after a pause.</span></div><div class="card"><div class="eyebrow">YOUR FOCUS</div><p>'+esc(g.title)+'</p><span style="font-size:10px;color:#78857d">'+kinds[g.type]+" · "+g.minutes+' min/day</span><p><button class="link" data-page="coach">Talk through today →</button></p></div></div></div>'}
function streak(g){let n=0,i=elapsed(g)+1;while(i>0&&g.done.includes(Math.min(i,g.days))){n++;i--}return n}
function goals(){let a=D.goals.filter(g=>g.active),html="";a.forEach(g=>html+='<div class="card goal"><div><b>'+esc(g.title)+'</b><small>'+kinds[g.type]+' · '+g.minutes+" min/day · "+g.done.length+"/"+g.days+' complete</small><div class="bar" style="width:175px;margin-top:8px"><i style="width:'+stats(g).pct+'%"></i></div></div><button data-do="delete" data-id="'+g.id+'">×</button></div>');$("#view").innerHTML='<div class="eyebrow">YOUR PERSONAL PATHS</div><div class="welcome"><div><h1 class="title">My goals</h1><p class="intro">Choose a direction. Your plan can change as you do.</p></div><button class="btn" data-do="new">+ Add a goal</button></div><div class="goals">'+(html||'<div class="card empty"><h2>Your goals will live here</h2><p>Start with one meaningful change.</p><button class="btn" data-do="new">Create a goal</button></div>')+'</div><div class="note">Removing a goal erases its plan and progress from this browser.</div>'}
function form(){let types="";Object.keys(kinds).forEach(k=>types+='<option value="'+k+'">'+kinds[k]+"</option>");$("#view").innerHTML='<div class="eyebrow">MAKE A PLAN THAT FITS YOUR LIFE</div><h1 class="title">What would you like to grow?</h1><p class="intro">A few details make your daily challenges more useful.</p><form class="card form" id="goalform"><div class="formgrid"><div class="field full"><label>Your goal</label><input name="goal" required maxlength="120" placeholder="e.g. Learn data analysis, build upper-body strength"></div><div class="field"><label>Area</label><select name="type">'+types+'</select></div><div class="field"><label>Time frame</label><select name="days"><option value="7">1 week</option><option value="30">1 month</option><option value="60" selected>2 months</option><option value="90">3 months</option><option value="180">6 months</option><option value="365">1 year</option></select></div><div class="field"><label>Time per day</label><select name="minutes"><option>10</option><option>20</option><option selected>30</option><option>45</option><option>60</option></select></div><div class="field"><label>Starting point</label><select name="level"><option>Just starting</option><option>Some experience</option><option>Experienced</option></select></div><div class="field full"><label>What should we take into account? (optional)</label><textarea name="context" maxlength="500" placeholder="Schedule, equipment, resources, preferences, or constraints"></textarea></div></div><button class="btn">Build my plan →</button> <button class="btn light" type="button" data-page="home">Cancel</button><div class="note">Plans use offline templates and your inputs. Practical prompts, not expert or medical advice.</div></form>'}
function coach(){let html=D.chat.map(m=>'<div class="bubble '+(m.you?"you":"")+'">'+esc(m.text)+"</div>").join("");$("#view").innerHTML='<div class="eyebrow">A THOUGHTFUL CHECK-IN</div><h1 class="title">Your coach</h1><p class="intro">An offline reflection guide to make the next step manageable.</p><div class="card chat"><div class="msgs" id="msgs">'+(html||'<div class="bubble">Hi! I can help you reflect on your goal, make a task smaller, or think through a missed day. I use your saved plan and fixed offline prompts.</div>')+'</div><form id="chatform"><input class="chatinput" name="msg" maxlength="500" placeholder="What’s on your mind?" required><button class="btn">Send</button></form></div><div class="note">Fixed offline responses; no AI-generated facts. For specialist questions, consult a trusted source or qualified professional.</div>'}
function settings(){$("#view").innerHTML='<div class="eyebrow">YOUR DEVICE, YOUR DATA</div><h1 class="title">Settings</h1><p class="intro">No account needed. Plans and progress are stored in this browser.</p><div class="card form settings"><div class="setting"><div><b>Display name</b><small>Stored on this device.</small></div><input id="name" value="'+esc(D.name)+'"></div><div class="setting"><div><b>Download a backup</b><small>Export goals and progress as JSON.</small></div><button class="btn light" data-do="export">Export</button></div><div class="setting"><div><b>Restore a backup</b><small>Load a saved Daymark file.</small></div><label class="btn light">Choose file<input id="restore" type="file" accept="application/json" hidden></label></div><div class="setting"><div><b>Clear local data</b><small>Remove goals, plans, and check-ins.</small></div><button class="btn light" data-do="clear">Clear data</button></div></div><div class="note">Data does not sync between devices. Export a backup before clearing browser data.</div>'}
function answer(s){let m=s.toLowerCase(),g=D.goals.find(x=>x.active);if(/miss|skip|behind|failed/.test(m))return"A missed day does not erase progress. Resume with the next planned challenge, or make today’s version smaller. Try a five-minute first step.";if(/hard|difficult|overwhelm|too much/.test(m))return"Try just the first five minutes, split the task, or edit your daily time budget.";if(/easy|advanced|too simple/.test(m))return"Deepen the task by explaining an idea from memory, adding one constraint, or creating a harder example.";if(/offline|private|work/.test(m))return"Your data is saved in this browser on this device. Challenges come from bundled templates; there is no server or online AI chat. Export a backup before clearing browser data.";if(g){let t=task(g,stats(g).day);return'Your focus is "'+g.title+'." Today: '+t.title+". "+t.desc+" Complete it by: "+t.proof}return"Tell me what you want to grow, or create a goal first. I can help make the next step smaller."}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.body.addEventListener("click",e=>{let b=e.target.closest("[data-do],[data-page]");if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.do==="new")form();if(b.dataset.do==="done"){let g=D.goals.find(x=>x.id===b.dataset.id),n=stats(g).day;if(!g.done.includes(n))g.done.push(n);save();render();toast("Challenge complete. Nice work!")}if(b.dataset.do==="delete"){let g=D.goals.find(x=>x.id===b.dataset.id);if(confirm("Remove "+g.title+" and its progress?")){D.goals=D.goals.filter(x=>x!==g);save();render()}}if(b.dataset.do==="export"){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="daymark-backup.json";a.click()}if(b.dataset.do==="clear"&&confirm("Clear all saved goals and progress?")){D={goals:[],name:"You",chat:[]};save();render()}});document.body.addEventListener("submit",e=>{if(e.target.id==="goalform"){e.preventDefault();let f=new FormData(e.target),title=String(f.get("goal")).trim();D.goals.unshift({id:Math.random().toString(36).slice(2),title,type:f.get("type"),days:+f.get("days"),minutes:+f.get("minutes"),level:f.get("level"),context:f.get("context"),start:now(),done:[],active:true});save();page="home";render();toast("Plan ready. Start small!")}if(e.target.id==="chatform"){e.preventDefault();let msg=new FormData(e.target).get("msg");D.chat.push({you:true,text:msg},{you:false,text:answer(msg)});D.chat=D.chat.slice(-40);save();render()}});document.body.addEventListener("change",e=>{if(e.target.id==="name"){D.name=e.target.value.trim()||"You";save()}if(e.target.id==="restore"&&e.target.files[0]){let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.goals))throw 0;D=d;save();render()}catch{toast("Could not read backup")}};r.readAsText(e.target.files[0])}});function toast(s){let x=$("#toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}$("#date").textContent=new Intl.DateTimeFormat(undefined,{weekday:"long",month:"long",day:"numeric"}).format(new Date);render()})();
</script><script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
