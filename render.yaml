services:
  - type: web
    name: daymark-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ai_service:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: openrouter/free
      - key: FRONTEND_ORIGINS
        value: https://shreenathx.github.io,http://localhost:8000,http://127.0.0.1:8000
